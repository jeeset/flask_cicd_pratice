name: CI

# 觸發條件
on:
  push:
    branches: [main] # 只有推到 main 分支才跑
# 全域變數
env:
  IMAGE: quay.io/jeeset/flask_3.1.3
# jobs並列執行，steps序列執行
jobs:
  build-and-update:
    runs-on: ubuntu-24.04

    steps:
    # 把應用程式的原始碼抓下來
    - name: Checkout app repo
      uses: actions/checkout@v4
    - name: build requirements
      run: |
        pip install -r requirements.txt
    # flake8 檢查程式碼風格
    - name: Lint with flake8
      run: |
        flake8 . --count --show-source --statistics
    # pytest測試
    - name: Run tests
      run: |
        python -m pytest -v
    # 登入 container registry
    - name: Login to quay.io
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}
    # 建置映像檔並推上去
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: . # Dockerfile 的建置地方，用"."表示根目錄
        push: true
        tags: ${{ env.IMAGE }}:${{ github.sha }}
    # 把 GitOps repo 也抓下來
    - name: Checkout gitops repo
      uses: actions/checkout@v4
      with:
        repository: jeeset/gitops_cicd_pratice
        token: ${{ secrets.GITOPS_TOKEN }}
        path: gitops
    # 改寫 kustomization 裡的映像檔版本
    - name: Update image tag
      run: |
        cd gitops
        kustomize edit set image flask = ${{ env.IMAGE }}:${{ github.sha }}
    # 把修改 commit 回 GitOps repo
    - name: Commit and push
      run: |
        cd gitops
        git config user.name "ci-bot"
        git config user.email "ci-bot@users.noreply.github.com"
        git add .
        git commit -m "ci: update image to ${{ github.sha }}"
        git push
